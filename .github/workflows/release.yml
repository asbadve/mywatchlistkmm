name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  version:
    name: Compute release version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.compute.outputs.version_name }}
    steps:
      # A `v*` tag push carries the real version (`v1.2.3` -> "1.2.3", read by build.gradle.kts's
      # RELEASE_VERSION_NAME - see its declaration for how versionCode/versionName/packageVersion
      # are all derived from this one string). No tag (workflow_dispatch) means no release is
      # actually being cut - falls back to a run-numbered dev version instead of failing, since
      # this workflow is also useful for producing test artifacts without tagging anything.
      - name: Compute version from tag
        id: compute
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify before packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Run tests
        run: ./gradlew desktopTest

  package:
    name: Package desktop distributable
    needs: [verify, version]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # Windows runners default `run:` to pwsh, which can't invoke the ./gradlew script - Git
      # Bash is preinstalled there, so forcing bash keeps all three legs identical.
      - name: Package distributable
        shell: bash
        env:
          ORG_GRADLE_PROJECT_MY_WATCH_LIST_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RELEASE_VERSION_NAME: ${{ needs.version.outputs.version_name }}
        run: ./gradlew packageDistributionForCurrentOS

      # Only one of these three globs matches on any given OS - packageDistributionForCurrentOS
      # only builds the target(s) valid for the runner it's on (Dmg/macOS, Msi/Windows, Deb/Linux).
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  package-android:
    name: Package Android release APK + AAB
    needs: [verify, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The keystore itself never lives in the repo - it's base64-encoded into a secret and
      # decoded to a runner-local temp file here, which build.gradle.kts's signingConfigs block
      # then reads via ANDROID_RELEASE_KEYSTORE_PATH. Without all four secrets present,
      # build.gradle.kts silently falls back to debug signing instead of failing, so a missing
      # secret here would ship a debug-signed "release" APK rather than error loudly - keep all
      # four ANDROID_RELEASE_* secrets in sync in repo settings.
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/release.jks"

      # Both in one invocation (shared Gradle daemon/config-cache, same signing env) - the APK is
      # for direct-install/sideload distribution via the GitHub Release below; the AAB is the
      # actual format Play Console requires for a Play Store submission (it rejects a plain APK
      # upload). Neither is a substitute for the other.
      - name: Build release APK and AAB
        env:
          ORG_GRADLE_PROJECT_MY_WATCH_LIST_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ needs.version.outputs.version_name }}
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Not attached to the GitHub Release below (that's for direct-install users, who need an
      # APK, not an AAB) - download this artifact from the workflow run and upload it to Play
      # Console by hand, since Play Store submission isn't part of this pipeline.
      - name: Upload Android AAB (for manual Play Console upload)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [package, package-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless a job explicitly asks for more - without this,
    # softprops/action-gh-release gets a 403 "Resource not accessible by integration" trying to
    # create the release.
    permissions:
      contents: write
    steps:
      # Deliberately not a single "download everything" step: android-release-aab must never
      # reach this public GitHub Release. It isn't directly installable (Play Console's own
      # bundletool split-APK generation is the only thing that can turn it into something a
      # device can install) - publishing it here would only confuse direct-install users. It's
      # downloaded from the workflow run's own artifact list instead, for manual Play Console
      # upload - see package-android's upload step.
      - name: Download desktop distributables
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: dist/android-release-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
