name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default is 'tools platform-tools', but Google removed the legacy 'tools'
          # package from the SDK repository, so sdkmanager fails ("Failed to find package 'tools'")
          # and the whole job dies in under a minute. Gradle fetches the platforms/build-tools it
          # needs on its own.
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Compile desktop
        run: ./gradlew compileKotlinDesktop

      - name: Run tests with coverage
        run: ./gradlew desktopTestCoverage

      - name: Android compile
        run: ./gradlew assembleDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: composeApp/build/test-results/desktopTest/**
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: composeApp/build/reports/jacoco/desktopTestCoverage/**
          if-no-files-found: ignore

  ios-tests:
    # The same commonTest suite as verify (UI tests included), run on the iOS simulator - catches
    # code and tests that only work on the JVM. A separate job so it runs in parallel on macOS.
    # macOS minutes cost ~10x Linux ones, so - like android-device-tests - only for pull requests
    # into master or a release/* branch.
    if: github.event_name == 'pull_request' && (github.base_ref == 'master' || startsWith(github.base_ref, 'release/'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Gradle configures every target, Android included, even for an iOS-only task.
          packages: 'platform-tools'

      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-konan-${{ runner.os }}-

      - name: Run tests on the iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: composeApp/build/test-results/iosSimulatorArm64Test/**
          if-no-files-found: ignore

  android-device-tests:
    # The same commonTest suite (UI tests included) on an Android emulator. Slow (~11 min locally),
    # so only for pull requests into master or a release/* branch - not every push.
    if: github.event_name == 'pull_request' && (github.base_ref == 'master' || startsWith(github.base_ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Enable KVM
        # Hardware acceleration for the emulator on Linux runners (the emulator action's own setup).
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and test APKs
        # Outside the emulator step, so the emulator isn't idling while Gradle compiles.
        run: ./gradlew :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest

      - name: Run tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :composeApp:connectedDebugAndroidTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-results
          path: |
            composeApp/build/outputs/androidTest-results/connected/**
            composeApp/build/reports/androidTests/connected/**
          if-no-files-found: ignore
