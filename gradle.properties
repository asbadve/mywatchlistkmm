
#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"

#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir

#Compose
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9's new Kotlin-multiplatform-aware DSL isn't compatible with this module's
# com.android.application + org.jetbrains.kotlin.multiplatform combination without a larger
# module restructure (see AGP 9 migration guide). These flags restore the pre-9.0 interop
# behavior so the existing module layout keeps working.
android.builtInKotlin=false
android.newDsl=false
